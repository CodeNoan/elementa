<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Redefinir senha · Elementa</title>
    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e8edf5; background: #0b1018; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #273444; border-radius: 20px; background: #121a25; box-sizing: border-box; }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { color: #a7b2c5; line-height: 1.55; }
      label { display: block; margin: 18px 0 7px; font-size: 14px; }
      input { width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid #344354; border-radius: 10px; color: #fff; background: #0b1018; box-sizing: border-box; font: inherit; }
      button { width: 100%; margin-top: 22px; min-height: 48px; border: 0; border-radius: 10px; color: #08130f; background: #79dfb5; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 24px; margin-top: 16px; }
      .hidden { display: none; }
      a { color: #79dfb5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Nova senha</h1>
      <p>Escolha uma senha com pelo menos 8 caracteres para voltar ao Elementa.</p>
      <form id="form" class="hidden">
        <label for="password">Nova senha</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required />
        <label for="confirm">Repita a nova senha</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required />
        <button id="submit" type="submit">Salvar nova senha</button>
      </form>
      <p id="status" role="status" aria-live="polite">Verificando o link…</p>
    </main>
    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      // Preencha com a URL e a chave pública anon/publishable do seu projeto.
      // Nunca use a chave service_role nesta página.
      const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
      const SUPABASE_ANON_KEY = "SUA-CHAVE-PUBLICA";
      const status = document.querySelector("#status");
      const form = document.querySelector("#form");
      const submit = document.querySelector("#submit");

      if (SUPABASE_URL.includes("SEU-PROJETO") || SUPABASE_ANON_KEY === "SUA-CHAVE-PUBLICA") {
        status.textContent = "Configure a URL e a chave pública do Supabase nesta página antes de hospedá-la.";
      } else {
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { detectSessionInUrl: true, persistSession: false, autoRefreshToken: false },
        });
        const { data, error } = await supabase.auth.getSession();
        if (error || !data.session) {
          status.textContent = "Este link não é válido ou expirou. Solicite uma nova recuperação no aplicativo.";
        } else {
          form.classList.remove("hidden");
          status.textContent = "Link válido. Defina sua nova senha abaixo.";
          form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const password = document.querySelector("#password").value;
            const confirm = document.querySelector("#confirm").value;
            if (password.length < 8) {
              status.textContent = "Use uma senha com pelo menos 8 caracteres.";
              return;
            }
            if (password !== confirm) {
              status.textContent = "As senhas não são iguais.";
              return;
            }
            submit.disabled = true;
            status.textContent = "Salvando…";
            const { error: updateError } = await supabase.auth.updateUser({ password });
            submit.disabled = false;
            if (updateError) {
              status.textContent = updateError.message;
              return;
            }
            form.classList.add("hidden");
            status.textContent = "Senha atualizada. Volte ao aplicativo e entre com a nova senha.";
          });
        }
      }
    </script>
  </body>
</html>
